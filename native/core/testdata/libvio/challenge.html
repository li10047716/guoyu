<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>正在验证您的浏览器</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#eef2f7; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --accent:#2563eb; --accent-contrast:#ffffff; --ring:rgba(37,99,235,.35);
  --ok:#059669; --err:#dc2626; --track:#e2e8f0; --border:#e2e8f0;
  --shadow:0 12px 32px rgba(2,6,23,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#121b2d; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#60a5fa; --accent-contrast:#0b1220; --ring:rgba(96,165,250,.4);
    --ok:#34d399; --err:#f87171; --track:#26344d; --border:#26344d;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
          max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
/* 短屏（横屏手机、放大字体）时顶部对齐并允许滚动，绝不裁切内容 */
@media (max-height:600px){ body{align-items:flex-start} }
.card{
  width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:38px 32px 26px;text-align:center;
}
.icon{width:54px;height:54px;margin:0 auto 14px;color:var(--accent);display:block}
/* 成功勾默认隐藏——写在 CSS 而不是 JS 里，禁用 JS 时也绝不出现 */
#icon-tick{opacity:0;transition:opacity .2s ease}
.card.done #icon-tick{opacity:1}
.card.done .icon{color:var(--ok)}
h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
/* 交互区：auto 方案不渲染任何控件，:empty 直接收掉，不留固定空白 */
#ia{display:flex;align-items:center;justify-content:center;padding:4px 0 10px}
#ia:empty{display:none}
.hide{display:none !important}

/* checkbox 方案 */
.ck{
  display:inline-flex;align-items:center;gap:12px;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  border:1px solid var(--border);border-radius:12px;padding:14px 22px;background:transparent;
  transition:border-color .15s ease,background .15s ease,opacity .15s ease;
  max-width:100%;
}
.ck:hover{border-color:var(--accent)}
.ck input{position:absolute;opacity:0;width:1px;height:1px}
.ck .box{
  width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;
  display:inline-flex;align-items:center;justify-content:center;background:transparent;
  transition:border-color .15s ease,background .15s ease;
}
.ck .box svg{width:15px;height:15px;color:var(--accent-contrast);opacity:0;transform:scale(.5);transition:opacity .15s ease,transform .15s ease}
.ck input:checked + .box{background:var(--accent);border-color:var(--accent)}
.ck input:checked + .box svg{opacity:1;transform:scale(1)}
.ck input:focus-visible + .box{outline:3px solid var(--ring);outline-offset:2px}
.ck .ck-label{font-size:15px;font-weight:600;text-align:left}
.ck.busy{opacity:.65;cursor:default}

/* slider 方案 */
.sl-wrap{width:100%;max-width:320px}
.sl{
  -webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;
  cursor:pointer;
  /* 横向拖动归滑块，不与页面滚动抢手势 */
  touch-action:none;
}
.sl:focus{outline:none}
.sl::-webkit-slider-runnable-track{
  height:44px;border-radius:22px;border:1px solid var(--border);
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill,0%),var(--track) var(--fill,0%),var(--track) 100%);
}
.sl::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:38px;height:38px;margin-top:2.5px;border-radius:50%;
  background:var(--card);border:2px solid var(--accent);
  box-shadow:0 2px 8px rgba(2,6,23,.25);cursor:grab;
}
.sl::-moz-range-track{height:44px;border-radius:22px;border:1px solid var(--border);background:var(--track)}
.sl::-moz-range-progress{height:44px;border-radius:22px;background:var(--accent)}
.sl::-moz-range-thumb{
  width:38px;height:38px;border-radius:50%;background:var(--card);border:2px solid var(--accent);
  box-shadow:0 2px 8px rgba(2,6,23,.25);cursor:grab;
}
.sl:focus-visible::-webkit-slider-thumb{outline:3px solid var(--ring);outline-offset:2px}
.sl:focus-visible::-moz-range-thumb{outline:3px solid var(--ring);outline-offset:2px}
.sl:disabled{cursor:default;opacity:.75}
.sl-hint{color:var(--muted);font-size:12.5px;margin-top:10px;text-align:center}

/* 状态区 */
#status{font-size:14px;color:var(--muted);min-height:1.6em}
.card.done #status{color:var(--ok);font-weight:600}
#status.err{color:var(--err);font-weight:600}
.prog{
  height:6px;border-radius:3px;background:var(--track);overflow:hidden;
  margin:12px auto 0;max-width:320px;
}
.prog-fill{height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .25s ease}
.card.done .prog-fill{background:var(--ok);width:100% !important}
#hint{color:var(--muted);font-size:12.5px;margin:10px 0 0;min-height:1.5em}
#hint.warn{color:var(--err)}
.btn{
  margin-top:16px;border:none;border-radius:10px;padding:10px 26px;font-size:14.5px;font-weight:600;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ns{color:var(--err);font-size:13.5px;margin:6px 0 0}
.foot{
  color:var(--muted);font-size:11.5px;line-height:1.55;margin:24px 0 0;
  border-top:1px solid var(--border);padding-top:14px;text-align:left;
}
@media (max-width:400px){
  .card{padding:28px 18px 20px;border-radius:16px}
  h1{font-size:17.5px}
  .ck{padding:12px 16px;gap:10px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<main class="card" id="card" aria-labelledby="title">
  <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 2 4 5v6c0 5.1 3.4 9.5 8 11 4.6-1.5 8-5.9 8-11V5l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path id="icon-tick" d="m8.6 12.2 2.3 2.3 4.5-4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 id="title">正在验证您的浏览器</h1>
  <p class="sub" id="subtitle">验证会自动进行，通常只需几秒钟，完成后自动返回原页面。</p>
  <div id="ia"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="prog hide" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="prog-fill" id="progFill"></div></div>
  <p id="hint"></p>
  <button id="retry" class="btn hide" type="button"></button>
  <noscript><p class="ns">此页面需要 JavaScript 才能完成验证。请在浏览器中启用 JavaScript 后刷新。</p></noscript>
  <p class="foot" id="foot">本页面由 CDN 安全防护自动生成。验证由浏览器完成一次工作量证明（Proof-of-Work），点击或滑动只是开始验证，不采集个人信息，也不采集行为特征。</p>
</main>
<script>
(function () {
  "use strict";
  var TS = "1793152763", SIG = "4af87b0c408a41e43f74b267fbf2900beb5df02e37e3fe833ba52846702eb68e", DIFF = "0000", MODE = "auto";
  // PoW cookie 名由服务端按入口协议注入（HTTP/HTTPS 同域隔离，见 NODE_OWNED_COOKIE_NAMES）
  var POW = "__cdn_pow";
  var EXPECT = 65536;        // PoW 期望尝试次数（服务端按难度推导）
  var MAX_ITER = EXPECT * 32;     // 尝试上限：远高于期望，避免正常设备被误判
  var TIME_BUDGET_MS = 60000;     // 总时间预算：60 秒
  var HURRY_MS = 10000;           // 最后 10 秒切换到更明确的提示
  var BATCH = 2048;               // 主线程兜底每批次数
  var STATUS_THROTTLE_MS = 900;   // 状态行（live region）最小更新间隔
  var T = {
  computing: "正在计算安全令牌…约 {p}%",
  computingLong: "比预期久，仍在计算安全令牌…",
  starting: "正在准备验证…",
  ok: "验证通过，正在返回原页面…",
  progLabel: "验证进度",
  remain: "预计剩余 {s} 秒",
  hurry: "还剩 {s} 秒。若迟迟无法完成，多半是网络中断或设备较慢，可以直接重试。",
  failTimeout: "验证超时。可能是网络不稳定或设备较慢，请重试。",
  failCookie: "浏览器禁用了 Cookie，无法保存验证结果。请允许本站 Cookie 后重试。",
  failGeneric: "验证没有完成，请重试。",
  retry: "重新验证",
  ckLabel: "我是真人",
  ckDesc: "勾选后立即开始验证，不会收集任何个人信息。",
  ckWorking: "已确认，正在验证",
  slLabel: "滑动验证",
  slDesc: "拖到最右侧开始验证；键盘用户可按 End 键或方向键。",
  slValue: "已滑动 {v}%",
  slDone: "已到终点，开始验证",
  slWorking: "已完成滑动，正在验证"
};

  var elCard = document.getElementById("card");
  var elIa = document.getElementById("ia");
  var elStatus = document.getElementById("status");
  var elProg = document.getElementById("prog");
  var elProgFill = document.getElementById("progFill");
  var elHint = document.getElementById("hint");
  var elRetry = document.getElementById("retry");
  elProg.setAttribute("aria-label", T.progLabel);
  elRetry.textContent = T.retry;
  elRetry.addEventListener("click", function () { location.reload(); });

  var started = false, finished = false;
  var deadline = 0, ticker = 0;
  var lastStatusAt = 0, lastStatusText = "";

  // live region 节流：阶段变化（force）立即播报，进度刷新至多 ~0.9s 一次。
  function setStatus(text, force) {
    if (text === lastStatusText) return;
    var now = Date.now();
    if (!force && now - lastStatusAt < STATUS_THROTTLE_MS) return;
    lastStatusAt = now;
    lastStatusText = text;
    elStatus.textContent = text;
  }
  function setProgress(pct) {
    elProg.classList.remove("hide");
    elProgFill.style.width = pct + "%";
    elProg.setAttribute("aria-valuenow", String(pct));
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = 0; } }

  function startCountdown() {
    function tick() {
      if (finished) return;
      var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      // 倒计时刻意不放在 live region 里：每秒播报一次纯属噪音。
      if (deadline - Date.now() <= HURRY_MS) {
        elHint.className = "warn";
        elHint.textContent = T.hurry.replace("{s}", String(left));
      } else {
        elHint.className = "";
        elHint.textContent = T.remain.replace("{s}", String(left));
      }
    }
    tick();
    ticker = setInterval(tick, 1000);
  }

  function showSuccess() {
    finished = true;
    stopTicker();
    elHint.textContent = "";
    elHint.className = "";
    elCard.classList.add("done");
    elStatus.className = "";
    setStatus(T.ok, true);
    setProgress(100);
    setTimeout(function () { location.reload(); }, 450);
  }
  function showFailure(msg) {
    finished = true;
    stopTicker();
    elHint.textContent = "";
    elHint.className = "";
    elProg.classList.add("hide");
    elStatus.className = "err";
    setStatus(msg, true);
    elRetry.classList.remove("hide");
    elRetry.focus();
  }

  // ---------- SHA-256（纯 JS，同步；Worker 与主线程兜底共用） ----------
  // 有意不用 Web Crypto 的摘要接口：它只有 Promise 形态，逐次等待会把一个纯 CPU 循环
  // 拆成数万个微任务，反而更慢；同步实现让 Worker 里就是一个干净的紧循环，
  // 浏览器禁用 Web Crypto 时也能照常完成验证。
  function jssha256(msg){var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];var b=[];for(var i=0;i<msg.length;i++)b.push(msg.charCodeAt(i));b.push(128);while(b.length%64!=56)b.push(0);var bl=msg.length*8;for(var i=7;i>=0;i--)b.push(i<4?((bl>>>(i*8))&255):0);for(var off=0;off<b.length;off+=64){var w=[];for(var i=0;i<16;i++)w[i]=(b[off+i*4]<<24)|(b[off+i*4+1]<<16)|(b[off+i*4+2]<<8)|b[off+i*4+3];for(var i=16;i<64;i++){var s0=((w[i-15]>>>7)|(w[i-15]<<25))^((w[i-15]>>>18)|(w[i-15]<<14))^(w[i-15]>>>3);var s1=((w[i-2]>>>17)|(w[i-2]<<15))^((w[i-2]>>>19)|(w[i-2]<<13))^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}var a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];for(var i=0;i<64;i++){var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));var ch=(e&f)^((~e)&g);var t1=(h+S1+ch+K[i]+w[i])|0;var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));var mj=(a&b2)^(a&c)^(b2&c);var t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}return H.map(function(v){return("00000000"+((v<0?v+0x100000000:v).toString(16))).slice(-8)}).join("")}

  // 近似进度：PoW 是无记忆随机搜索，"已试 / 期望"只是估算，超出期望后如实改口。
  function reportAttempts(n) {
    if (finished) return;
    if (n >= EXPECT) {
      setStatus(T.computingLong, false);
      setProgress(99);
      return;
    }
    var pct = Math.min(99, Math.floor((n / EXPECT) * 100));
    setStatus(T.computing.replace("{p}", String(pct)), false);
    setProgress(pct);
  }

  function finish(nonce) {
    document.cookie = POW + "=" + TS + "_" + MODE + "_" + nonce + "_" + SIG +
      "; path=/; samesite=lax" + (location.protocol === "https:" ? "; secure" : "");
    if (document.cookie.indexOf(POW + "=") === -1) {
      showFailure(T.failCookie);
      return;
    }
    showSuccess();
  }

  // ---------- 方案 1：Web Worker（同步紧循环，不阻塞主线程） ----------
  function solveInWorker() {
    var src =
      jssha256.toString() + ";\n" +
      "onmessage=function(e){var d=e.data;\n" +
      "  for(var i=0;i<d.maxIter;i++){\n" +
      "    if(jssha256(d.sig+i).lastIndexOf(d.diff,0)===0){postMessage({found:i});return}\n" +
      "    if((i%d.step)===d.step-1)postMessage({progress:i+1});\n" +
      "  }\n" +
      "  postMessage({exhausted:true});\n" +
      "};";
    var url;
    try {
      url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    } catch (e) { return false; }
    var w;
    try {
      w = new Worker(url);
    } catch (e) {
      URL.revokeObjectURL(url);
      return false;
    }
    var done = false;
    function cleanup() { done = true; clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); }
    var timer = setTimeout(function () {
      if (done) return;
      cleanup();
      showFailure(T.failTimeout);
    }, TIME_BUDGET_MS);
    w.onerror = function () {
      if (done) return;
      cleanup();
      // Worker 起不来（CSP/旧内核）→ 回退主线程分批求解
      solveOnMainThread();
    };
    w.onmessage = function (e) {
      if (done) return;
      var d = e.data || {};
      if (typeof d.found === "number") { cleanup(); finish(String(d.found)); }
      else if (typeof d.progress === "number") { reportAttempts(d.progress); }
      else if (d.exhausted) { cleanup(); showFailure(T.failGeneric); }
    };
    w.postMessage({ sig: SIG, diff: DIFF, maxIter: MAX_ITER, step: BATCH });
    return true;
  }

  // ---------- 方案 2：主线程分批（旧浏览器兜底，每批让出以免冻结 UI） ----------
  function solveOnMainThread() {
    var i = 0;
    function step() {
      if (finished) return;
      var end = Math.min(i + BATCH, MAX_ITER);
      for (; i < end; i++) {
        if (jssha256(SIG + i).lastIndexOf(DIFF, 0) === 0) { finish(String(i)); return; }
      }
      if (Date.now() > deadline) { showFailure(T.failTimeout); return; }
      if (i >= MAX_ITER) { showFailure(T.failGeneric); return; }
      reportAttempts(i);
      setTimeout(step, 0); // 宏任务让出，浏览器有机会渲染
    }
    setTimeout(step, 0);
  }

  function startPow() {
    if (started) return;
    started = true;
    deadline = Date.now() + TIME_BUDGET_MS;
    setStatus(T.starting, true);
    setProgress(0);
    startCountdown();
    var ok = false;
    if (typeof Worker !== "undefined" && typeof URL !== "undefined" &&
        typeof Blob !== "undefined" && URL.createObjectURL) {
      ok = solveInWorker();
    }
    if (!ok) solveOnMainThread();
  }

  // ---------- 按方案构建交互区 ----------
  function buildCheckbox() {
    var label = document.createElement("label");
    label.className = "ck";
    var input = document.createElement("input");
    input.type = "checkbox";
    input.id = "ck";
    input.setAttribute("aria-describedby", "ck-desc subtitle");
    var box = document.createElement("span");
    box.className = "box";
    box.setAttribute("aria-hidden", "true");
    box.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="m3.5 8.5 3 3 6-6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var text = document.createElement("span");
    text.className = "ck-label";
    text.textContent = T.ckLabel;
    label.appendChild(input);
    label.appendChild(box);
    label.appendChild(text);
    var desc = document.createElement("span");
    desc.id = "ck-desc";
    desc.className = "hide";
    desc.textContent = T.ckDesc;
    elIa.appendChild(label);
    elIa.appendChild(desc);
    input.addEventListener("change", function () {
      if (!input.checked) return;
      input.disabled = true;
      label.classList.add("busy");
      text.textContent = T.ckWorking;
      startPow();
    });
    input.focus();
  }

  function buildSlider() {
    var wrap = document.createElement("div");
    wrap.className = "sl-wrap";
    var input = document.createElement("input");
    input.type = "range";
    input.className = "sl";
    input.min = "0";
    input.max = "100";
    input.step = "1";
    input.value = "0";
    input.setAttribute("aria-label", T.slLabel);
    input.setAttribute("aria-describedby", "sl-hint subtitle");
    var hint = document.createElement("div");
    hint.className = "sl-hint";
    hint.id = "sl-hint";
    hint.textContent = T.slDesc;
    wrap.appendChild(input);
    wrap.appendChild(hint);
    elIa.appendChild(wrap);
    function paint() {
      var v = parseInt(input.value, 10) || 0;
      input.style.setProperty("--fill", v + "%");
      // aria-valuetext：读屏播报"已滑动 40%"，比裸数字 40 有意义
      input.setAttribute("aria-valuetext", v >= 100 ? T.slDone : T.slValue.replace("{v}", String(v)));
    }
    paint();
    input.addEventListener("input", function () {
      paint();
      if (parseInt(input.value, 10) >= 100) {
        input.disabled = true;
        hint.textContent = T.slWorking;
        startPow();
      }
    });
    // 松手未到终点 → 回弹归零
    function snapBack() {
      if (!input.disabled && parseInt(input.value, 10) < 100) { input.value = "0"; paint(); }
    }
    input.addEventListener("pointerup", snapBack);
    input.addEventListener("touchend", snapBack);
    input.focus();
  }

  if (MODE === "checkbox") buildCheckbox();
  else if (MODE === "slider") buildSlider();
  else startPow();
})();
</script>
</body>
